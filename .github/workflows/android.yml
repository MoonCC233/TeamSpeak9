name: Android CI

# Android 客户端（client/mobile，git submodule → TS6_Droid_CN）的构建。
#
# 关键前提（都已实测确认）：
#   · client/mobile 只有 main 一个 source set，没有 test / androidTest，
#     所以**不要**跑 ./gradlew test，那会是一次空跑
#   · buildRustLibs 是个 Exec 任务，指向不存在的 ${rootDir}/../tslib_multi
#     （tslib 源码不可得，仓库里只有预编译的 libtslib_jni.so），
#     必须用 -x buildRustLibs 跳过；jniLibs 已随 submodule 入库
#   · settings.gradle.kts 里的阿里云镜像被 GITHUB_ACTIONS != "true" 包住，
#     CI 上自动走 google() / mavenCentral()
#   · app/build.gradle.kts 的 signingConfigs 硬编码了 release.keystore 的口令，
#     所以这里**不**往 submodule 里放 keystore，而是先出 unsigned APK
#     再用 apksigner 单独签名，这样任意口令的 keystore 都能用，
#     且不必修改 submodule
#
# 签名 release APK 需要配置以下仓库 secrets（缺任何一个就只出 debug APK）：
#   ANDROID_KEYSTORE_BASE64  keystore 文件的 base64（base64 -w0 my.jks）
#   ANDROID_KEY_ALIAS        密钥别名
#   ANDROID_KEYSTORE_PASSWORD  keystore 口令
#   ANDROID_KEY_PASSWORD     密钥口令（与 keystore 口令相同时可省略）

on:
  push:
    branches:
      - main
      - master
    paths:
      # client/mobile 是 submodule，父仓库只跟踪一个 gitlink，
      # 所以这里是精确路径而不是 client/mobile/**。
      - 'client/mobile'
      - '.gitmodules'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'client/mobile'
      - '.gitmodules'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # git 记录的权限位已经是 100755，这一步只是防止某些 checkout 场景丢掉执行位。
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: client/mobile

      - name: Read version name
        id: meta
        shell: bash
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' client/mobile/app/build.gradle.kts | head -n1)
          if [ -z "$version" ]; then
            echo "未能从 app/build.gradle.kts 读出 versionName" >&2
            exit 1
          fi
          echo "版本：$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # secrets 上下文在 step 的 if: 里不可用，只能先落成一个 step output。
      - name: Detect signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "检测到签名配置，将额外产出已签名的 release APK。"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "未配置签名 secrets，只产出 debug APK。"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -x buildRustLibs
        working-directory: client/mobile

      - name: Stage debug APK
        shell: bash
        run: |
          mkdir -p artifacts
          cp client/mobile/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/TS6Droid-${{ steps.meta.outputs.version }}-debug.apk"

      - name: Build release APK
        if: steps.signing.outputs.enabled == 'true'
        run: ./gradlew --no-daemon assembleRelease -x buildRustLibs
        working-directory: client/mobile

      # 不复用 submodule 里的 signingConfigs（口令硬编码为 ts6droid），
      # 而是对 unsigned APK 走 zipalign + apksigner，口令只经环境变量传递。
      - name: Sign release APK
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          unsigned=$(ls client/mobile/app/build/outputs/apk/release/*.apk | head -n1)
          echo "待签名：$unsigned"

          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?未设置 ANDROID_HOME / ANDROID_SDK_ROOT}}"
          buildtools=$(ls -d "$sdk"/build-tools/*/ | sort -V | tail -n1)
          echo "build-tools：$buildtools"

          # keystore 只落在 runner 的临时目录，绝不进工作区，避免被后续步骤打包进产物。
          keystore="$RUNNER_TEMP/release.jks"
          aligned="$RUNNER_TEMP/aligned.apk"
          # 无论后续哪一步失败，都在退出时清理 keystore 与对齐后的 APK。
          trap 'rm -f "$keystore" "$aligned"' EXIT

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"

          "${buildtools}zipalign" -p -f 4 "$unsigned" "$aligned"

          # apksigner 从环境变量读口令，避免出现在进程命令行里。
          export KS_PASS="$KEYSTORE_PASSWORD"
          export KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          "${buildtools}apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out "artifacts/TS6Droid-${{ steps.meta.outputs.version }}-release.apk" \
            "$aligned"

          "${buildtools}apksigner" verify --print-certs \
            "artifacts/TS6Droid-${{ steps.meta.outputs.version }}-release.apk"

      - name: Write checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TeamSpeak9-android
          path: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
